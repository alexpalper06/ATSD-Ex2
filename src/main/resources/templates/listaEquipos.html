<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Team List')"></head>
<body>
    <div th:replace="fragments::navbar"></div>
    <div class="container-fluid">

        <div class="row mt-3">
            <div class="col">
                <h2>Teams</h2>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <div th:if="${equipos != null and equipos.size() > 0}">
                    <table class="table table-striped" style="table-layout: fixed;">
                        <thead>
                            <tr>
                                <th class="col-2">ID</th>
                                <th class="col-8">Team Name</th>
                                <th class="col-2">Members</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="equipo : ${equipos}">
                                <td th:text="${equipo.id}" class="text-truncate"></td>
                                <td class="text-truncate">
                                    <a th:href="@{/teams/{id}/members(id=${equipo.id})}" th:text="${equipo.nombre}"></a>
                                </td>
                                <td>
                                    <a th:href="@{/teams/{id}/members(id=${equipo.id})}" class="btn btn-primary btn-sm"> View Members </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination controls -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination mb-0 justify-content-center"
                            th:with="
                        maxVisible=5,
                        half=2,
                        pStart=${(currentPage - half) < 0 ? 0 : (currentPage - half)},
                        pEnd=${(pStart + maxVisible - 1) >= totalPages ? (totalPages - 1) : (pStart + maxVisible - 1)},
                        start=${(pEnd - maxVisible + 1) <= 0 ? 0 : (pEnd - maxVisible + 1)},
                        end=${pEnd}">
                            <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/teams(page=0)}" th:if="${hasPrevious}">First</a>
                                <span class="page-link" th:if="!${hasPrevious}">First</span>
                            </li>
                            <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/teams(page=${currentPage - 1})}" th:if="${hasPrevious}">Previous</a>
                                <span class="page-link" th:if="!${hasPrevious}">Previous</span>
                            </li>

                            <li th:each="p : ${#numbers.sequence(start, end)}"
                                th:classappend="${p == currentPage} ? 'active' : ''"
                                class="page-item">
                                <a class="page-link" th:if="${p != currentPage}" th:href="@{/registered(page=${p})}" th:text="${p + 1}"></a>
                                <span class="page-link" th:if="${p == currentPage}" th:text="${p + 1}"></span>
                            </li>

                            <li class="page-item" th:classappend="${!hasNext} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/teams(page=${currentPage + 1})}" th:if="${hasNext}">Next</a>
                                <span class="page-link" th:if="!${hasNext}">Next</span>
                            </li>
                            <li class="page-item" th:classappend="${!hasNext} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/teams(page=${totalPages - 1})}" th:if="${hasNext}">Last</a>
                                <span class="page-link" th:if="!${hasNext}">Last</span>
                            </li>
                        </ul>
                    </nav>
                </div>

                <div th:if="${equipos == null or equipos.size() == 0}" class="alert alert-warning" role="alert">
                    <strong>No teams found.</strong> There are no teams created in the system yet.
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments :: javascript"></div>
</body>
</html>
